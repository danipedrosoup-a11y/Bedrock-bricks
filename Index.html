<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEDROCK BRICKS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://unpkg.com/blockly@10.4.2/blockly.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/blockly@10.4.2/blockly.min.css">
    <script src="https://unpkg.com/ace-builds@1.4.12/src-min-noconflict/ace.js"></script>
    <style>
        :root {
            --cor-logica: #FF7000;
            --cor-eventos: #FF3366;
            --cor-acoes: #3366FF;
            --cor-dados: #FFCC00;
        }
        .tab-active { background: #165DFF; color: white; border-radius: 8px 8px 0 0; }
        .blocklyToolboxDiv { background: #f8f9fa; border-right: 2px solid #e5e7eb; }
        .blocklyTreeRow { padding: 4px 0; }
        .blocklyTreeLabel { font-weight: 500 !important; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 shadow-lg">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold text-center flex items-center justify-center gap-2">
                <i class="fa fa-cube"></i> Criador de Addons Minecraft Bedrock
            </h1>
            <p class="text-center text-blue-100 text-sm mt-1">Blocos visuais + Código | Feito especialmente para você</p>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-7xl">
        <!-- Abas -->
        <div class="flex mb-6 border-b border-gray-200">
            <button id="tabBlocks" class="px-6 py-3 tab-active font-medium transition-all">🧱 Editor de Blocos</button>
            <button id="tabCode" class="px-6 py-3 text-gray-600 hover:bg-gray-100 rounded-t-lg transition-all">💻 Editor de Código</button>
            <button id="tabExport" class="px-6 py-3 text-gray-600 hover:bg-gray-100 rounded-t-lg transition-all">📦 Exportar</button>
        </div>

        <!-- Área Blocos -->
        <div id="areaBlocks" class="bg-white rounded-xl shadow-lg p-2 h-[650px] border border-gray-100">
            <div id="blocklyDiv" class="w-full h-full rounded-lg overflow-hidden"></div>
            
            <xml id="toolbox" style="display: none">
                <!-- 🟠 CATEGORIA LÓGICA - 5 TIPOS / 10 SUBTIPOS (COMO VOCÊ PEDIU) -->
                <category name="Lógica e Condições" colour="#FF7000" secondaryColour="#E65C00">
                    
                    <!-- TIPO 1: SE... ENTÃO -->
                    <block type="logic_if">
                        <field name="SUBTYPE">vivo</field>
                    </block>
                    
                    <!-- TIPO 2: SE NÃO... ENTÃO -->
                    <block type="logic_if_not">
                        <field name="SUBTYPE">nao_vivo</field>
                    </block>
                    
                    <!-- TIPO 3: SE... SENÃO... -->
                    <block type="logic_if_else">
                        <field name="SUBTYPE">dia</field>
                    </block>
                    
                    <!-- TIPO 4: REPETIR ENQUANTO... -->
                    <block type="logic_while">
                        <field name="SUBTYPE">chao</field>
                    </block>
                    
                    <!-- TIPO 5: COMPARAR VALORES -->
                    <block type="logic_compare">
                        <field name="OP">EQ</field>
                        <value name="A">
                            <block type="dados_valor"><field name="VAL">Vida</field></block>
                        </value>
                        <value name="B">
                            <block type="dados_numero"><field name="NUM">10</field></block>
                        </value>
                    </block>
                </category>

                <!-- 🟣 EVENTOS -->
                <category name="Eventos" colour="#FF3366" secondaryColour="#E62E5C">
                    <block type="evento_inicio"></block>
                    <block type="evento_tick"></block>
                    <block type="evento_interagir"></block>
                    <block type="evento_morrer"></block>
                </category>

                <!-- 🔵 AÇÕES -->
                <category name="Ações" colour="#3366FF" secondaryColour="#1A53CC">
                    <block type="acao_mensagem"></block>
                    <block type="acao_dar_item"></block>
                    <block type="acao_definir_vida"></block>
                    <block type="acao_efeito"></block>
                </category>

                <!-- 🟡 DADOS -->
                <category name="Dados e Valores" colour="#FFCC00" secondaryColour="#E6B800">
                    <block type="dados_numero"></block>
                    <block type="dados_texto"></block>
                    <block type="dados_entidade"></block>
                </category>
            </xml>
        </div>

        <!-- Área Código -->
        <div id="areaCode" class="bg-white rounded-xl shadow-lg p-4 h-[650px] border border-gray-100 hidden">
            <div id="aceEditor" class="w-full h-full rounded-lg"></div>
        </div>

        <!-- Área Exportar -->
        <div id="areaExport" class="bg-white rounded-xl shadow-lg p-10 text-center border border-gray-100 hidden">
            <div class="max-w-md mx-auto">
                <i class="fa fa-download text-6xl text-green-500 mb-4"></i>
                <h3 class="text-2xl font-bold text-gray-800 mb-2">Pronto para Baixar!</h3>
                <p class="text-gray-600 mb-6">Seu addon está criado e pronto para ser usado no Minecraft Bedrock</p>
                <button id="btnDownload" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg transition-all w-full">
                    Baixar Arquivo .mcaddon
                </button>
            </div>
        </div>
    </div>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { mine: '#165DFF', laranja: '#FF7000' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }

        // --------------------------
        // DEFINIÇÃO DOS BLOCOS - LÓGICA (5 TIPOS / 10 SUBTIPOS)
        // --------------------------
        Blockly.defineBlocksWithJsonArray([
            
            // TIPO 1: SE... ENTÃO
            {
                "type": "logic_if",
                "message0": "SE %1 for atendida:",
                "args0": [
                    {
                        "type": "field_dropdown",
                        "name": "SUBTYPE",
                        "options": [
                            ["estiver vivo", "vivo"],
                            ["estiver no chão", "chao"],
                            ["segurar o item", "item_mao"],
                            ["vida for menor que", "vida_menor"],
                            ["for de dia", "dia"],
                            ["estiver na água", "agua"],
                            ["bloco embaixo for", "bloco_embaixo"],
                            ["jogador estiver próximo", "proximo"],
                            ["tiver item no inventário", "inv_item"],
                            ["estiver com efeito", "efeito"]
                        ]
                    }
                ],
                "message1": "└─> então %1",
                "args1": [{"type": "input_statement", "name": "DO"}],
                "colour": "#FF7000",
                "tooltip": "Executa apenas se a condição for verdadeira",
                "previousStatement": null,
                "nextStatement": null
            },

            // TIPO 2: SE NÃO... ENTÃO
            {
                "type": "logic_if_not",
                "message0": "SE NÃO %1:",
                "args0": [
                    {
                        "type": "field_dropdown",
                        "name": "SUBTYPE",
                        "options": [
                            ["estiver vivo", "nao_vivo"],
                            ["estiver no chão", "nao_chao"],
                            ["segurar o item", "nao_item"],
                            ["vida for maior que", "vida_maior"],
                            ["for de noite", "noite"],
                            ["estiver na água", "nao_agua"],
                            ["bloco embaixo não for", "bloco_nao"],
                            ["jogador não estiver perto", "longe"],
                            ["não tiver item", "inv_vazio"],
                            ["sem efeito", "sem_efeito"]
                        ]
                    }
                ],
                "message1": "└─> então %1",
                "args1": [{"type": "input_statement", "name": "DO"}],
                "colour": "#FF7000",
                "tooltip": "Executa se a condição for falsa",
                "previousStatement": null,
                "nextStatement": null
            },

            // TIPO 3: SE... SENÃO...
            {
                "type": "logic_if_else",
                "message0": "SE %1:",
                "args0": [
                    {
                        "type": "field_dropdown",
                        "name": "SUBTYPE",
                        "options": [
                            ["estiver vivo", "vivo"],
                            ["estiver no chão", "chao"],
                            ["segurar o item", "item"],
                            ["vida < 5", "pouca_vida"],
                            ["for de dia", "dia"],
                            ["estiver na água", "agua"],
                            ["bloco for pedra", "pedra"],
                            ["jogador por perto", "perto"],
                            ["tem comida", "comida"],
                            ["tem velocidade", "velocidade"]
                        ]
                    }
                ],
                "message1": "├─> SIM: %1",
                "args1": [{"type": "input_statement", "name": "DO"}],
                "message2": "└─> NÃO: %1",
                "args2": [{"type": "input_statement", "name": "ELSE"}],
                "colour": "#FF7000",
                "tooltip": "Escolhe entre duas ações",
                "previousStatement": null,
                "nextStatement": null
            },

            // TIPO 4: REPETIR ENQUANTO...
            {
                "type": "logic_while",
                "message0": "REPETIR ENQUANTO %1:",
                "args0": [
                    {
                        "type": "field_dropdown",
                        "name": "SUBTYPE",
                        "options": [
                            ["estiver vivo", "vivo"],
                            ["estiver no chão", "chao"],
                            ["segurar o item", "item"],
                            ["vida > 0", "vida"],
                            ["for dia", "dia"],
                            ["na água", "agua"],
                            ["bloco é areia", "areia"],
                            ["jogador aqui", "aqui"],
                            ["tiver espada", "espada"],
                            ["com fogo", "fogo"]
                        ]
                    }
                ],
                "message1": "└─> fazer %1",
                "args1": [{"type": "input_statement", "name": "DO"}],
                "colour": "#FF7000",
                "tooltip": "Repete ação enquanto for verdade",
                "previousStatement": null,
                "nextStatement": null
            },

            // TIPO 5: COMPARAR VALORES
            {
                "type": "logic_compare",
                "message0": "%1 %2 %3",
                "args0": [
                    {"type": "input_value", "name": "A"},
                    {"type": "field_dropdown", "name": "OP", "options": [
                        ["é IGUAL A", "EQ"], ["é DIFERENTE DE", "NEQ"],
                        ["é MAIOR QUE", "GT"], ["é MENOR QUE", "LT"],
                        ["≥", "GTE"], ["≤", "LTE"],
                        ["TEM ITEM", "ITEM"], ["SEM ITEM", "NOITEM"],
                        ["BLOCO É", "BLOCK"], ["BIOMA É", "BIOME"]
                    ]},
                    {"type": "input_value", "name": "B"}
                ],
                "colour": "#FF7000",
                "output": "Boolean",
                "tooltip": "Compara dois valores"
            },

            // DEMAIS BLOCOS BÁSICOS
            {"type": "evento_inicio", "message0": "Quando o mundo carregar", "colour": "#FF3366", "nextStatement": null},
            {"type": "evento_tick", "message0": "A cada tick", "colour": "#FF3366", "nextStatement": null},
            {"type": "evento_interagir", "message0": "Quando clicar/interagir", "colour": "#FF3366", "nextStatement": null},
            {"type": "acao_mensagem", "message0": "enviar mensagem %1", "args0": [{"type": "input_value", "name": "MSG", "check": "String"}], "colour": "#3366FF", "previousStatement": null},
            {"type": "acao_dar_item", "message0": "dar item %1 quantidade %2", "args0": [{"type": "input_value", "name": "ITEM"}, {"type": "input_value", "name": "QTD", "check": "Number"}], "colour": "#3366FF", "previousStatement": null},
            {"type": "acao_definir_vida", "message0": "definir vida para %1", "args0": [{"type": "input_value", "name": "VIDA", "check": "Number"}], "colour": "#3366FF", "previousStatement": null},
            {"type": "acao_efeito", "message0": "aplicar efeito %1 tempo %2", "args0": [{"type": "input_value", "name": "EFEITO"}, {"type": "input_value", "name": "TEMPO", "check": "Number"}], "colour": "#3366FF", "previousStatement": null},
            {"type": "dados_texto", "message0": "%1", "args0": [{"type": "field_input", "name": "TEXT", "text": "Olá Mundo!"}], "colour": "#FFCC00", "output": "String"},
            {"type": "dados_numero", "message0": "%1", "args0": [{"type": "field_number", "name": "NUM", "value": 10}], "colour": "#FFCC00", "output": "Number"},
            {"type": "dados_valor", "message0": "%1", "args0": [{"type": "field_input", "name": "VAL", "text": "Valor"}], "colour": "#FFCC00", "output": null}
        ]);

        // --------------------------
        // SISTEMA DE ABAS E INICIALIZAÇÃO
        // --------------------------
        const tabBlocks = document.getElementById('tabBlocks');
        const tabCode = document.getElementById('tabCode');
        const tabExport = document.getElementById('tabExport');
        const areaBlocks = document.getElementById('areaBlocks');
        const areaCode = document.getElementById('areaCode');
        const areaExport = document.getElementById('areaExport');

        function trocarAba(ativa) {
            [tabBlocks, tabCode, tabExport].forEach(t => t.classList.remove('tab-active'));
            [areaBlocks, areaCode, areaExport].forEach(a => a.classList.add('hidden'));
            
            if(ativa === 'blocks') { 
                tabBlocks.classList.add('tab-active'); 
                areaBlocks.classList.remove('hidden'); 
                Blockly.svgResize(blocklyWorkspace);
            }
            if(ativa === 'code') { 
                tabCode.classList.add('tab-active'); 
                areaCode.classList.remove('hidden'); 
                editor.resize(); 
            }
            if(ativa === 'export') { 
                tabExport.classList.add('tab-active'); 
                areaExport.classList.remove('hidden'); 
            }
        }

        tabBlocks.onclick = () => trocarAba('blocks');
        tabCode.onclick = () => trocarAba('code');
        tabExport.onclick = () => trocarAba('export');

        // Inicia o Blockly
        const blocklyArea = document.getElementById('blocklyDiv');
        const blocklyWorkspace = Blockly.inject(blocklyArea, {
            toolbox: document.getElementById('toolbox'),
            zoom: { controls: true, wheel: true, startScale: 1.0, maxScale: 3, minScale: 0.3 },
            trashcan: true,
            sounds: false
        });

        // Inicia o Editor de Código
        const editor = ace.edit("aceEditor");
        editor.setTheme("ace/theme/github");
        editor.session.setMode("ace/mode/json");
        editor.setValue(`{
  "format_version": "1.20.0",
  "minecraft:addon": {
    "description": {
      "identifier": "seu_nome:seu_addon",
      "name": "Meu Primeiro Addon",
      "version": [1, 0, 0]
    }
  }
}`, -1);

        // Botão de Download
        document.getElementById('btnDownload').onclick = () => {
            alert('✅ Addon gerado com sucesso! Em versões futuras o download automático estará disponível.');
        };

        // Ajusta tamanho ao redimensionar
        window.onresize = () => Blockly.svgResize(blocklyWorkspace);
    </script>
</body>
</html>
